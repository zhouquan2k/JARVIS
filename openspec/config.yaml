schema: my-workflow

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform
context: |
  we need both openspec docs(proposal,design,specs) for English and Chinese, tasks不需要中文版
  对于浏览器插件extension的e2e测试用例，因为codex沙盒的限制，请申请提权运行。注意：MV3 扩展测试需要走 channel: 'chromium'，否则 Playwright 默认的 headless shell 拉不起扩展 service worker。
  extension e2e测试通过后，请运行pnpm --filter extension build
  在verify时，要求跑所有的e2e测试用例，确保没有回归。
  在verify时，应检查当前设计是否和ARCHITECTURE.md中的设计一致，如果存在不一致，需要报告，并verify失败
  在归档时，应该把design中的类图合并到全局类图中(workspace.dsl, 增加或合并到已有类图)
  在归档时，需要同时提供英文和中文的版本
  
# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
rules:
  design:
    - 使用mermaid画出类图，描述本次设计相关类及其关系，描述类的重要职责分配。
  tasks:
    - generate e2e testcases. use playwright as the testing framework.